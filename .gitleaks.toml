# gitleaks config for wisehealth-website — used by CI and the pre-commit hook.
# Extends the upstream default rules (AWS, GitHub, Stripe, JWT, private keys, …)
# with a rule for the shape that actually leaked here once: an OAuth
# client_id/client_secret pair written as `key: value` in a markdown file.
# Replayed against the pre-rewrite history: upstream defaults flag the
# client_secret line but NOT the client_id line; this rule flags both.
#
# Exceptions live in .gitleaksignore, by FINGERPRINT only — never by path or
# rule, so an exception can never silence a new secret.

title = "wisehealth-website"

[extend]
useDefault = true

[[rules]]
id = "credential-assignment"
description = "Credential-named key assigned a long literal (client_secret, client_id, api_key, token, password)"
regex = '''(?i)\b(client[_-]?secret|client[_-]?id|api[_-]?key|access[_-]?token|refresh[_-]?token|auth[_-]?token|secret[_-]?key|private[_-]?key|password|passwd)\b["'`*]*\s*[:=]\s*["'`]?([A-Za-z0-9_\-.\/+=]{16,})'''
secretGroup = 2
entropy = 3.0
keywords = ["secret", "client", "api", "token", "password", "passwd", "key"]

# The value is a reference to an environment variable, not a literal secret:
# `apiKey = process.env.MYDR_API_KEY`, `import.meta.env.X`, `os.environ["X"]`.
# Scoped to THIS rule and matched on the secret itself — never by path.
[[rules.allowlists]]
description = "environment-variable references"
regexTarget = "secret"
regexes = [
  '''^(process\.env|import\.meta\.env|os\.environ|Deno\.env)\b''',
]
