# Netlify Configuration for WiseHealth
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command
  command = "npm run build"
  
  # Directory with build output
  publish = "build"
  
  # Node version
  environment = { NODE_VERSION = "20" }

# Serverless functions: /api/mydr-status (MyDr booking health probe).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Environment variables (set these in Netlify UI for security)
# Required:
# - MYDR_BOOKING_URL: URL for MyDr booking system
# Optional (for future API integration):
# - MYDR_API_KEY: API key for MyDr integration
# - MYDR_API_BASE_URL: Base URL for MyDr API

# Redirects and rewrites
[[redirects]]
  # Redirect old WordPress URLs if needed (examples)
  from = "/uslugi"
  to = "/oferta"
  status = 301

# NO catch-all rewrite. Docusaurus emits a real HTML file per route plus
# build/404.html, which Netlify serves with status 404 for unknown paths.
# The old `/* -> /index.html 200` turned every typo and dead link into a
# soft-404 (the homepage with 200), which search engines penalise.

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Content Security Policy (adjust as needed)
    # plausible.io is required for the cookieless analytics script; without it
    # the browser silently blocks the tag and we get no data at all.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mydr.pl https://plugin.mydr.pl https://plausible.io; style-src 'self' 'unsafe-inline' https://mydr.pl https://plugin.mydr.pl; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://mydr.pl https://plugin.mydr.pl https://plausible.io; frame-src https://mydr.pl https://plugin.mydr.pl;"

[[headers]]
  for = "/static/*"
  [headers.values]
    # Cache static assets for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

