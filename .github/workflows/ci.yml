name: ci

# One required check guards master: `ci-ok`. It passes only when EVERY gate
# below finished with `success` — a skipped or cancelled gate fails it, so a
# broken dependency can never be mistaken for a pass. Adding a job? Add it to
# `ci-ok.needs` AND to the result check, or it does not gate anything.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks + forbidden filenames, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, so add-then-delete secrets are still caught
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (sha256-verified)
        run: |
          set -euo pipefail
          v=8.30.1
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Use master's scanner config on PRs (a PR cannot weaken its own scan)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          for f in .gitleaks.toml .gitleaksignore scripts/check-forbidden-files.sh; do
            if git cat-file -e "$base:$f" 2>/dev/null; then
              git show "$base:$f" > "$f"
              echo "using $f from $base"
            else
              echo "::warning::$f absent on $base — using this PR's copy (bootstrap)"
            fi
          done
          chmod +x scripts/check-forbidden-files.sh

      - name: Guard self-test (each control RED-proven in a throwaway repo)
        run: scripts/test-secret-guard.sh

      - name: Forbidden filenames anywhere in history
        run: scripts/check-forbidden-files.sh --history

      - name: gitleaks — every commit on every fetched ref
        run: >-
          gitleaks git --no-banner --redact --verbose
          --config .gitleaks.toml
          --gitleaks-ignore-path .gitleaksignore
          --log-opts="--all"
          .

  build-test:
    name: install → typecheck → build → SEO tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20 # same as netlify.toml NODE_VERSION
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  ci-ok:
    name: ci-ok
    if: always()
    needs: [secrets, build-test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "secrets=${{ needs.secrets.result }} build-test=${{ needs.build-test.result }}"
          if [ "${{ needs.secrets.result }}" != "success" ] || [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "::error::a required gate did not succeed (skipped and cancelled count as failure)"
            exit 1
          fi
