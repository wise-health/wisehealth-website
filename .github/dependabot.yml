# Dependabot: weekly update PRs for npm and the pinned GitHub Actions.
# Every PR runs the full `ci` gate (secret scan + build + SEO + function tests)
# before it can merge. Docusaurus packages move together in one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # TypeScript 7 removed `baseUrl`, which Docusaurus 3.x's @docusaurus/tsconfig
      # still sets (TS5102 -> typecheck fails). Re-enable once Docusaurus supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
